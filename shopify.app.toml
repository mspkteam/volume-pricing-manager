# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "97480e97d6bd60193b5e48196127411a"
name = "Volume Pricing Manager"
application_url = "https://volume-pricing-manager.vercel.app"
embedded = true

[access_scopes]
# Least privilege for customer tier pricing automation.
# Default: last ~60 days of orders via read_orders.
# Do NOT declare read_all_orders until Shopify approves it in Partner Dashboard
# (API access requests → Read all orders). After approval, add:
#   ,read_all_orders
# so a full rolling 12-month history can be imported.
scopes = "read_customers,write_customers,read_orders,read_products,write_discounts,read_discounts,write_products"

[auth]
redirect_urls = [
  "https://volume-pricing-manager.vercel.app/auth/callback",
  "https://volume-pricing-manager.vercel.app/auth/shop",
  "https://volume-pricing-manager.vercel.app/auth/login",
  "https://volume-pricing-manager.vercel.app/auth/session-token",
  "https://volume-pricing-manager.vercel.app/auth/exit-iframe"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [
    "orders/create",
    "orders/updated",
    "orders/paid",
    "orders/cancelled",
    "orders/edited"
  ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds"
  topics = ["refunds/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers"
  topics = ["customers/create", "customers/update", "customers/delete"]

  # Mandatory compliance topics (enable for App Store / public distribution)
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[app_proxy]
url = "https://volume-pricing-manager.vercel.app/proxy"
subpath = "volume-pricing"
prefix = "apps"

[pos]
embedded = false
